<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching original warmth -->
    <radialGradient id="baseBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="35%" stop-color="#FFF0E6" />
      <stop offset="65%" stop-color="#FCE0EC" />
      <stop offset="100%" stop-color="#E9D5FA" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveTopLeft" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#FFD1C1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FDBEDB" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E2D4FD" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="waveRightSide" x1="100%" y1="10%" x2="20%" y2="80%">
      <stop offset="0%" stop-color="#FDC5D8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E3CCFD" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF1E8" stop-opacity="0" />
    </linearGradient>

    <!-- Bubble Shaders -->
    <!-- Pink Iridescent Glass Bubble -->
    <radialGradient id="pinkGlassSphere" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFEBF3" />
      <stop offset="65%" stop-color="#FCA5C8" />
      <stop offset="90%" stop-color="#CFB3FD" />
      <stop offset="100%" stop-color="#B1C7FE" />
    </radialGradient>

    <!-- Blue/Lilac Iridescent Glass Bubble -->
    <radialGradient id="blueGlassSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E8E5FE" />
      <stop offset="70%" stop-color="#AEC1FF" />
      <stop offset="95%" stop-color="#DAB2F8" />
      <stop offset="100%" stop-color="#F9AEC8" />
    </radialGradient>

    <!-- Small Coral / Peach Spheres -->
    <radialGradient id="peachSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFC5CE" />
      <stop offset="85%" stop-color="#FF8E9E" />
      <stop offset="100%" stop-color="#E784B8" />
    </radialGradient>

    <!-- Glow & Soft Filters -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    
    <filter id="highlightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#baseBg)" />

  <!-- Smooth Liquid Waves (Left & Top) -->
  <path d="M-50,-50 L650,-50 C550,220 300,320 180,480 C80,620 120,780 -50,850 Z" fill="url(#waveTopLeft)" />
  
  <!-- Flowing Ribbon Line (Top-Left) -->
  <path d="M 0,20 C 220,90 340,240 330,390 C 310,560 120,680 -20,760" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5" filter="url(#highlightGlow)" />

  <!-- Bottom Left Waves -->
  <path d="M-80,680 C180,640 380,780 480,950 C520,1020 540,1050 560,1100 L-80,1100 Z" fill="#F6D5F7" fill-opacity="0.35" />
  <path d="M -20,800 C 180,760 360,860 480,1080" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />

  <!-- Right & Bottom Right Smooth Waves -->
  <path d="M1950,150 C1650,220 1450,450 1480,700 C1500,860 1620,980 1950,1050 Z" fill="url(#waveRightSide)" />
  
  <!-- Flowing White Ribbons (Right) -->
  <path d="M 1940,30 C 1680,120 1520,320 1550,560 C 1580,760 1780,900 1950,960" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.8" filter="url(#highlightGlow)" />

  <!-- Central Ambient Wave Flow -->
  <path d="M 900,1100 C 1150,920 1450,850 1940,890 L 1940,1100 Z" fill="#FFE3EE" fill-opacity="0.3" />

  <!-- ================= BUBBLES ================= -->

  <!-- Top Left - Big Translucent Sphere -->
  <g transform="translate(360, 50)">
    <circle cx="0" cy="0" r="130" fill="url(#pinkGlassSphere)" opacity="0.6" />
    <ellipse cx="-40" cy="-40" rx="35" ry="18" fill="#FFFFFF" opacity="0.5" transform="rotate(-30, -40, -40)" />
  </g>

  <!-- Left Upper Floaters -->
  <circle cx="90" cy="145" r="40" fill="url(#peachSphere)" />
  <circle cx="50" cy="285" r="85" fill="url(#blueGlassSphere)" opacity="0.85" />
  <ellipse cx="25" cy="255" rx="20" ry="10" fill="#FFFFFF" opacity="0.65" transform="rotate(-30, 25, 255)" />
  <circle cx="465" cy="175" r="16" fill="url(#peachSphere)" />
  <circle cx="180" cy="255" r="13" fill="url(#peachSphere)" />
  <circle cx="68" cy="425" r="30" fill="url(#peachSphere)" />
  <circle cx="28" cy="485" r="9" fill="#D3A7F9" />

  <!-- Bottom Left - Layered Large Bubbles -->
  <!-- Middle size glowing sphere -->
  <g transform="translate(130, 715)">
    <circle cx="0" cy="0" r="130" fill="url(#pinkGlassSphere)" opacity="0.75" />
    <circle cx="0" cy="0" r="129" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
    <ellipse cx="-45" cy="-45" rx="38" ry="18" fill="#FFFFFF" opacity="0.8" transform="rotate(-30, -45, -45)" />
  </g>

  <!-- Large Bottom Corner Sphere -->
  <g transform="translate(180, 980)">
    <circle cx="0" cy="0" r="215" fill="url(#blueGlassSphere)" />
    <circle cx="0" cy="0" r="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.5" />
    <ellipse cx="-70" cy="-80" rx="65" ry="30" fill="#FFFFFF" opacity="0.75" transform="rotate(-30, -70, -80)" />
  </g>

  <!-- Small spheres near bottom left -->
  <circle cx="460" cy="775" r="42" fill="url(#blueGlassSphere)" />
  <circle cx="590" cy="860" r="38" fill="url(#peachSphere)" />
  <circle cx="700" cy="990" r="16" fill="url(#peachSphere)" />

  <!-- Top Right - Big Spheres -->
  <g transform="translate(1780, 60)">
    <circle cx="0" cy="0" r="155" fill="url(#pinkGlassSphere)" opacity="0.75" />
    <ellipse cx="-50" cy="-45" rx="45" ry="22" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, -50, -45)" />
  </g>
  <circle cx="1885" cy="190" r="85" fill="url(#blueGlassSphere)" />
  <circle cx="1530" cy="245" r="45" fill="url(#pinkGlassSphere)" />
  <circle cx="1590" cy="75" r="12" fill="url(#blueGlassSphere)" />
  <circle cx="1485" cy="72" r="9" fill="url(#peachSphere)" />

  <!-- Mid Right Floaters -->
  <circle cx="1820" cy="460" r="30" fill="url(#peachSphere)" />
  <circle cx="1770" cy="570" r="11" fill="#C9AEFF" />
  <circle cx="1735" cy="645" r="35" fill="url(#blueGlassSphere)" />

  <!-- Bottom Right - Foreground Giant Glass Sphere -->
  <g transform="translate(1850, 930)">
    <circle cx="0" cy="0" r="240" fill="url(#pinkGlassSphere)" />
    <circle cx="0" cy="0" r="239" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" />
    <ellipse cx="-75" cy="-85" rx="75" ry="35" fill="#FFFFFF" opacity="0.8" transform="rotate(-30, -75, -85)" />
  </g>

  <!-- Bottom Right Floating Spheres -->
  <g transform="translate(1495, 910)">
    <circle cx="0" cy="0" r="42" fill="url(#blueGlassSphere)" />
    <ellipse cx="-12" cy="-14" rx="12" ry="6" fill="#FFFFFF" opacity="0.7" transform="rotate(-30, -12, -14)" />
  </g>
  <circle cx="1580" cy="915" r="10" fill="url(#peachSphere)" />
  <circle cx="1930" cy="650" r="120" fill="url(#blueGlassSphere)" opacity="0.85" />

  <!-- Tiny Sparkle / Star Highlights -->
  <g transform="translate(1690, 565)" filter="url(#highlightGlow)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF" />
  </g>
  <g transform="translate(150, 590)" filter="url(#highlightGlow)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#FFFFFF" />
  </g>
</svg>